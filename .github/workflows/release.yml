name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.DBX_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.DBX_RELEASE_TOKEN }}
        run: |
          gh pr merge ${{ fromJson(steps.release.outputs.pr).number }} \
            --repo ${{ github.repository }} \
            --squash

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            target: dbx-darwin-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            target: dbx-darwin-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            target: dbx-linux-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: dbx-linux-amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          go build -ldflags="-s -w -X github.com/chrisfentiman/dbx/cmd.Version=${VERSION#v}" -o ${{ matrix.target }} .
          chmod +x ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf ${{ matrix.target }}.tar.gz ${{ matrix.target }}
          shasum -a 256 ${{ matrix.target }}.tar.gz > ${{ matrix.target }}.tar.gz.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            ${{ matrix.target }}.tar.gz \
            ${{ matrix.target }}.tar.gz.sha256
